<!-- Navbar (pattern-nav do design system) -->
<nav id="navbar" class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-black/10" aria-label="Navegação principal">
  <div class="flex z-10 h-[70px] max-w-[1440px] mr-auto ml-auto pr-6 pl-6 relative items-center justify-between gap-6">
    <a href="{% url 'dashboard-list' %}" class="text-[#0C0B07] font-semibold tracking-tight whitespace-nowrap">Gerenciamento de Finanças</a>
    <div class="flex items-center gap-4 overflow-x-auto no-scrollbar text-sm font-medium">
      <a href="{% url 'dashboard-list' %}" class="nav-link whitespace-nowrap hover:text-[#EF5F3C] transition-colors">Dashboard</a>
      <a href="{% url 'transaction-list' %}" class="nav-link whitespace-nowrap hover:text-[#EF5F3C] transition-colors">Transações</a>
      <a href="{% url 'account-list' %}" class="nav-link whitespace-nowrap hover:text-[#EF5F3C] transition-colors">Contas</a>
      <a href="{% url 'categorie-list' %}" class="nav-link whitespace-nowrap hover:text-[#EF5F3C] transition-colors">Categorias</a>
      <div class="dropdown">
        <button class="whitespace-nowrap px-6 py-2.5 bg-[#0C0B07] text-white rounded-full text-[15px] font-medium hover:bg-black/80 transition-all shadow-lg shadow-black/5 flex items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <iconify-icon icon="solar:user-circle-linear"></iconify-icon>
          {{ user.username|title }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          {% if user.is_superuser %}
            <li>
              <a class="dropdown-item" href="{% url 'admin:index' %}">
                <iconify-icon icon="lucide:shield-check"></iconify-icon>Painel Administrativo
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
          {% endif %}
          <li>
            <form action="{% url 'logout' %}" method="post" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="dropdown-item">
                <iconify-icon icon="lucide:arrow-right"></iconify-icon>Sair
              </button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
